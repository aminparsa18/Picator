---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempapitest
  labels:
    app: tempapitest
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: tempapitest
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tempapitest
    spec:
      containers:
      - name: tempapitest
        image: tempapitest:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: tempapitest-env
      terminationGracePeriodSeconds: 180