---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: picator-invitement
  labels:
    app: picator-invitement
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: picator-invitement
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: picator-invitement
    spec:
      containers:
      - name: picator-invitement
        image: picator-invitement:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: picator-invitement-env
      terminationGracePeriodSeconds: 180